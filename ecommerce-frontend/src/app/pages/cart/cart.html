<app-navbar></app-navbar>

<div class="container mt-5">

  <h2 class="mb-4">Your Cart</h2>

  <div class="alert alert-danger" *ngIf="errorMessage">
    {{ errorMessage }}
  </div>

  <div *ngIf="loading" class="text-center">
    Loading...
  </div>

  <div *ngIf="!loading && items.length === 0" class="alert alert-info">
    Your cart is empty. <a routerLink="/products">Browse products</a>
  </div>

  <table class="table align-middle" *ngIf="!loading && items.length > 0">
    <thead>
      <tr>
        <th>Product</th>
        <th>Price</th>
        <th>Quantity</th>
        <th>Subtotal</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let item of items">
        <td>{{ item.product?.name }}</td>
        <td>${{ item.product?.price }}</td>
        <td style="max-width: 120px;">
          <input type="number" class="form-control" min="1"
                 [value]="item.quantity"
                 (change)="updateQuantity(item, +$any($event.target).value)">
        </td>
        <td>${{ (item.product?.price || 0) * item.quantity }}</td>
        <td>
          <button class="btn btn-outline-danger btn-sm" (click)="removeItem(item._id)">
            Remove
          </button>
        </td>
      </tr>
    </tbody>
  </table>

  <div class="d-flex justify-content-between align-items-center mt-4" *ngIf="!loading && items.length > 0">
    <h4>Total: ${{ total }}</h4>
    <button class="btn btn-success" (click)="goToCheckout()">
      Proceed to Checkout
    </button>
  </div>

</div>
